# End-to-end smoke test from the public internet: is the app link serving,
# is the short link redirecting, is the database answering, and is the
# AI-voice API reachable with CORS open for this site's origin?
#
# Runs after every Pages deploy, on demand, and once a day. The daily run is
# not decoration: the Supabase project is on the free plan, which pauses a
# project after seven days without database activity — and a paused project
# takes sign-in, AI voices and cross-device sync down with it. A deploy is
# the only thing that used to touch it, and eleven quiet days brought a
# scheduled-for-pause warning. So the health check that should exist anyway
# now runs daily and reads the database while it is at it.
#
# Two things this does NOT protect against, both worth knowing:
#   - GitHub disables scheduled workflows in a repository with no commits for
#     60 days. Quiet that long and this stops running, silently.
#   - Anything else the free plan limits.
# The durable fix for a product with real users is the Pro plan.
name: Live smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 06:17 UTC daily — an odd minute, because the top of the hour is the most
    # contended slot on shared runners and the most likely to be dropped.
    # Daily against a seven-day threshold leaves six missed runs of margin.
    - cron: '17 6 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: App link serves the site
        run: |
          body=$(curl -sS --fail --max-time 30 https://topazh1.github.io/castbuddy-app/)
          echo "$body" | grep -q '<title>CastBuddy</title>' || { echo 'FAIL: page title missing'; exit 1; }
          echo "OK: app page serves with CastBuddy title ($(echo "$body" | wc -c) bytes)"

      - name: Supabase short link redirects to the app
        run: |
          location=$(curl -sS -o /dev/null -D - --max-time 30 https://dnbtpzguoudkjqvlmoau.supabase.co/functions/v1/app | tr -d '\r' | grep -i '^location:' | awk '{print $2}')
          echo "redirect -> $location"
          echo "$location" | grep -q 'topazh1.github.io/castbuddy-app' || { echo 'FAIL: redirect target wrong'; exit 1; }
          echo "OK: short link redirects to the app"

      # The step that both proves the database is up AND counts as the activity
      # that keeps it up. Supabase's pausing policy is specific about what it
      # measures — "user database activity", and "typically a few user requests
      # to the database each day" is enough to stay awake. Note *database*:
      # Edge Functions run on separate infrastructure, so neither function check
      # in this file touches Postgres. Only these requests do.
      #
      # Hence a few queries rather than one, across all three tables — still
      # trivial traffic, but comfortably on the right side of "a few" instead of
      # sitting exactly on the line of the smallest thing that might count.
      #
      # Every read comes back as an empty array: row-level security hides every
      # row from an unauthenticated caller. Real queries, real database, no data.
      - name: Database answers (and stays awake)
        run: |
          anon='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuYnRwemd1b3Vka2pxdmxtb2F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjkzMTcsImV4cCI6MjEwMTYwNTMxN30.kISyxdLzw_j__8bCdiDkA8e9oCqbOOXcnNDAetrKLYM'
          fail=0
          for table in scripts ai_usage analysis_hints; do
            code=$(curl -sS -o /tmp/db -w '%{http_code}' --max-time 30 \
              -H "apikey: $anon" -H "Authorization: Bearer $anon" \
              "https://dnbtpzguoudkjqvlmoau.supabase.co/rest/v1/$table?select=*&limit=1")
            echo "$table: status=$code body=$(head -c 120 /tmp/db)"
            [ "$code" = '200' ] || fail=1
            # Row-level security is what keeps these reads safe to run from a
            # public runner. A non-empty answer means anonymous callers can see
            # user rows, which is a data leak and must fail the build loudly.
            if [ "$(tr -d ' \n' < /tmp/db)" != '[]' ]; then
              echo "FAIL: $table returned rows to an anonymous caller — RLS is not protecting it."
              exit 1
            fi
          done
          if [ "$fail" != '0' ]; then
            echo 'FAIL: the database did not answer.'
            echo 'A paused project fails here first — check the Supabase dashboard.'
            exit 1
          fi
          echo 'OK: database answered every query; project is awake and RLS is holding'

      - name: AI-voice API answers preflight for the app origin
        run: |
          headers=$(curl -sS -o /dev/null -D - --max-time 30 -X OPTIONS \
            -H 'Origin: https://topazh1.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,apikey,content-type' \
            https://dnbtpzguoudkjqvlmoau.supabase.co/functions/v1/ai-proxy/engines | tr -d '\r')
          echo "$headers"
          echo "$headers" | grep -qi 'access-control-allow-origin' || { echo 'FAIL: no CORS on preflight'; exit 1; }
          echo "$headers" | grep -qi 'access-control-allow-headers:.*authorization' || { echo 'FAIL: authorization header not allowed'; exit 1; }
          echo "OK: preflight open for the app origin"

      - name: AI-voice API is alive and CORS-open on real responses
        run: |
          out=$(curl -sS -o /tmp/body -w '%{http_code}' -D /tmp/headers --max-time 30 \
            -H 'Origin: https://topazh1.github.io' \
            https://dnbtpzguoudkjqvlmoau.supabase.co/functions/v1/ai-proxy/engines)
          tr -d '\r' < /tmp/headers
          echo "status=$out body=$(cat /tmp/body | head -c 300)"
          case "$out" in
            200|400|401|403) : ;;
            *) echo "FAIL: unexpected status $out (function down?)"; exit 1 ;;
          esac
          grep -qi 'access-control-allow-origin' /tmp/headers || { echo 'FAIL: no CORS on response'; exit 1; }
          echo "OK: function alive (status $out, auth-gated as designed) with CORS headers"
