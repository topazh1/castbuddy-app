# Temporary API probe (manual only): confirm Dicta's nakdan accepts a JSON
# body sent as a CORS "simple request" (text/plain — no preflight needed).
name: Dicta probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: post text-plain nakdan-5-1
        continue-on-error: true
        run: |
          curl -sS -m 20 -D - -w '\nSTATUS=%{http_code}\n' -X POST 'https://nakdan-5-1.loadbalancer.dicta.org.il/api' \
            -H 'Origin: https://topazh1.github.io' \
            -H 'Content-Type: text/plain;charset=UTF-8' \
            --data '{"task":"nakdan","genre":"modern","data":"איחרת שוב"}' | head -c 1200; echo
      - name: post urlencoded-default nakdan-5-1
        continue-on-error: true
        run: |
          curl -sS -m 20 -D - -w '\nSTATUS=%{http_code}\n' -X POST 'https://nakdan-5-1.loadbalancer.dicta.org.il/api' \
            -H 'Origin: https://topazh1.github.io' \
            --data '{"task":"nakdan","genre":"modern","data":"איחרת שוב"}' | head -c 1200; echo
