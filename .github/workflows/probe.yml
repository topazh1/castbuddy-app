# Temporary API probe (manual only): check whether Dicta's nakdan endpoints
# answer browser CORS (preflight + response headers). Removed once integrated.
name: Dicta probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: preflight nakdan-5-1
        continue-on-error: true
        run: |
          curl -sS -m 20 -o /dev/null -D - -w 'STATUS=%{http_code}\n' -X OPTIONS 'https://nakdan-5-1.loadbalancer.dicta.org.il/api' \
            -H 'Origin: https://topazh1.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type'
      - name: post with origin nakdan-5-1
        continue-on-error: true
        run: |
          curl -sS -m 20 -o /dev/null -D - -w 'STATUS=%{http_code}\n' -X POST 'https://nakdan-5-1.loadbalancer.dicta.org.il/api' \
            -H 'Origin: https://topazh1.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"task":"nakdan","genre":"modern","data":"איחרת שוב"}'
      - name: preflight nakdan-2-0
        continue-on-error: true
        run: |
          curl -sS -m 20 -o /dev/null -D - -w 'STATUS=%{http_code}\n' -X OPTIONS 'https://nakdan-2-0.loadbalancer.dicta.org.il/api' \
            -H 'Origin: https://topazh1.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type'
      - name: post with origin nakdan-2-0
        continue-on-error: true
        run: |
          curl -sS -m 20 -o /dev/null -D - -w 'STATUS=%{http_code}\n' -X POST 'https://nakdan-2-0.loadbalancer.dicta.org.il/api' \
            -H 'Origin: https://topazh1.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"task":"nakdan","genre":"modern","data":"איחרת שוב"}'
